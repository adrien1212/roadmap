spring.application.name=roadmap
server.port=8045
# Behind the Vite dev proxy / prod reverse proxy: trust X-Forwarded-* to build public URLs.
server.forward-headers-strategy=framework

# Local MariaDB from the root docker-compose.yml; override with env vars elsewhere.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/roadmap}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Schema is owned by Liquibase; Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Store Instants (publishedAt, createdAt) in UTC, whatever the server timezone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Emails to subscribed Readers go through each Owner's own SMTP server.
# 32 random bytes, base64 (e.g. `openssl rand -base64 32`). Without it, SMTP settings can't be saved.
app.smtp.secret-key=${SMTP_SECRET_KEY:}
# Only for local dev (Mailpit on localhost); never in production.
app.smtp.allow-private-hosts=${SMTP_ALLOW_PRIVATE_HOSTS:false}
