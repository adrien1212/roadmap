databaseChangeLog:
  - changeSet:
      id: 001-owner
      author: roadmap
      changes:
        - createTable:
            tableName: owner
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: provider
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: provider_subject
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(320)
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: owner
            columnNames: provider, provider_subject
            constraintName: uk_owner_provider_subject
