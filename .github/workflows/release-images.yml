# Builds the backend and frontend images and pushes them to GitHub Container Registry
# when a version tag is pushed:  git tag v1.0.0 && git push origin v1.0.0
#   → ghcr.io/<owner>/roadmap-backend:1.0.0 (+ :1.0, :latest)
#   → ghcr.io/<owner>/roadmap-frontend:1.0.0 (+ :1.0, :latest)
name: Release images

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase; the owner may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/roadmap-${{ matrix.app }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The backend build runs the unit tests (mvn package); a failing test stops the release.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
